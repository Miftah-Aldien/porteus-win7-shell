name: Build Porteus 32-bit

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib libx11-dev:i386 binutils file

      - name: Build i686 (cross-compile, no QEMU)
        run: |
          mkdir -p build
          g++ -m32 -std=c++17 -O2 -Wall -Wextra -Wpedantic src/main.cpp -o build/win7shell -lX11

      - name: Verify binary
        run: |
          file build/win7shell
          readelf -h build/win7shell | grep -E 'Class:|Machine:'
          ldd build/win7shell || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: win7shell-linux-i686
          path: build/win7shell
