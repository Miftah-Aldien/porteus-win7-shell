# picom.conf - Aero Lite untuk netbook 1024x600 (Porteus 5.01)
# Ringan: backend xrender, blur kecil, tanpa animasi berat
backend = "xrender";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
# Blur hanya sedikit, biar tidak ngelag di Intel lama
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-frame = true;
# Taskbar win7shell: transparan dikit (0.92 = ala Win7 default, bukan bening banget)
# Kalau mau lebih bening, turunkan ke 0.85. Kalau mau lebih solid, naikkan ke 0.96
opacity-rule = [
  "92:class_g = 'Taskbar'",
  "95:class_g = 'Porteus Desktop'"
];
# Jangan blur / transparan untuk jendela Wine (biar app Windows tetap tajam)
# Wine jendela tetap opaque
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
# Matikan shadow berat
shadow = false;
# Fading halus tapi cepat
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
